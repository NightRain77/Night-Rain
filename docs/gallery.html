<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery with Tabs</title>
</head>

<body>
    <div class="container">
        <header>
            <h1>Photo Gallery</h1>
            <p class="subtitle">Explore our collection of stunning images organized by category. Click on the tabs to filter the gallery.</p>
        </header>

        <div class="tabs">
            <button class="tab active" data-category="all">All Photos</button>
            <button class="tab" data-category="nature">Nature</button>
            <button class="tab" data-category="architecture">Architecture</button>
            <button class="tab" data-category="travel">Travel</button>
            <button class="tab" data-category="food">Food</button>
        </div>

        <div class="gallery" id="gallery">
            <!-- Gallery items will be generated by JavaScript -->
        </div>
    </div>

    <footer>
        <p>Gallery with Tabs &copy; 2023</p>
    </footer>
    
</body>
</html>
